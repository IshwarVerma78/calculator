<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ======================================================
       index.html — iOS-inspired Calculator App
       Single-page app. Open directly in a browser (no server).
       ====================================================== -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── SEO & Meta ───────────────────────────────────────── -->
  <title>Calculator — Clean iOS-Style Web App</title>
  <meta name="description"
        content="A clean, iOS-inspired calculator web app built with HTML, CSS, and Vanilla JavaScript. Supports full arithmetic, history, and keyboard shortcuts." />
  <meta name="author" content="Internship Team" />
  <meta name="theme-color" content="#1c1c1e" />

  <!-- Open Graph (social sharing preview) -->
  <meta property="og:title"       content="Calculator App" />
  <meta property="og:description" content="iOS-inspired dark calculator — clean, fast, keyboard-friendly." />
  <meta property="og:type"        content="website" />

  <!-- ── Stylesheets (order matters: global first, component second) -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calculator.css" />
</head>

<body>
  <!-- ========================================================
       Main Application Shell
       Role="main" tells assistive tech this is primary content.
       ======================================================== -->
  <main role="main" aria-label="Calculator Application">

    <!-- Subtle branding label above the calculator -->
    <p class="app-title" aria-hidden="true">Calculator</p>

    <!-- ── Calculator Wrapper ──────────────────────────────── -->
    <section class="calculator-wrapper" aria-label="Calculator">

      <!-- ── 1. History Panel ────────────────────────────────
           Shows the last 5 completed calculations.
           aria-live="polite" announces updates to screen readers
           without interrupting the current speech stream.
           ─────────────────────────────────────────────────── -->
      <div class="history-panel" role="log" aria-label="Calculation history" aria-live="polite">
        <ul class="history-list" id="history-list">
          <!-- Populated dynamically by history.js → History.render() -->
        </ul>
      </div>

      <!-- ── 2. Display Area ─────────────────────────────────
           Two stacked lines inside a dark panel:
             #expression — secondary line (pending operation)
             #result     — primary line (current value / result)
           aria-live="assertive" reads value changes immediately.
           ─────────────────────────────────────────────────── -->
      <div class="display" role="region" aria-label="Calculator display">
        <div id="expression"
             aria-label="Current expression"
             aria-live="polite"></div>
        <div id="result"
             aria-label="Result"
             aria-live="assertive"
             aria-atomic="true">0</div>
      </div>

      <!-- Thin visual separator -->
      <div class="divider" aria-hidden="true"></div>

      <!-- ── 3. Button Grid ──────────────────────────────────
           5 rows × 4 columns using CSS Grid.
           Every button has a unique ID for automated testing.
           onclick binds directly to Calculator.* method names.
           ─────────────────────────────────────────────────── -->
      <div class="btn-grid" role="group" aria-label="Calculator buttons">

        <!-- ── Row 1: Function & Operator ────────────────── -->

        <!-- AC — All Clear: resets everything -->
        <button id="btn-ac"
                class="btn btn-function"
                onclick="Calculator.clear()"
                aria-label="All Clear">
          AC
        </button>

        <!-- +/- — Toggle sign of current value -->
        <button id="btn-toggle"
                class="btn btn-function"
                onclick="Calculator.toggleSign()"
                aria-label="Toggle positive / negative">
          +/−
        </button>

        <!-- % — Convert to percentage -->
        <button id="btn-percent"
                class="btn btn-function"
                onclick="Calculator.percentage()"
                aria-label="Percent">
          %
        </button>

        <!-- ÷ — Divide operator -->
        <button id="btn-div"
                class="btn btn-operator"
                onclick="Calculator.handleOperator('÷')"
                aria-label="Divide">
          ÷
        </button>

        <!-- ── Row 2: 7 8 9 × ─────────────────────────────── -->

        <button id="btn-7"
                class="btn btn-number"
                onclick="Calculator.handleNumber('7')"
                aria-label="7">
          7
        </button>

        <button id="btn-8"
                class="btn btn-number"
                onclick="Calculator.handleNumber('8')"
                aria-label="8">
          8
        </button>

        <button id="btn-9"
                class="btn btn-number"
                onclick="Calculator.handleNumber('9')"
                aria-label="9">
          9
        </button>

        <!-- × — Multiply operator -->
        <button id="btn-mul"
                class="btn btn-operator"
                onclick="Calculator.handleOperator('×')"
                aria-label="Multiply">
          ×
        </button>

        <!-- ── Row 3: 4 5 6 − ─────────────────────────────── -->

        <button id="btn-4"
                class="btn btn-number"
                onclick="Calculator.handleNumber('4')"
                aria-label="4">
          4
        </button>

        <button id="btn-5"
                class="btn btn-number"
                onclick="Calculator.handleNumber('5')"
                aria-label="5">
          5
        </button>

        <button id="btn-6"
                class="btn btn-number"
                onclick="Calculator.handleNumber('6')"
                aria-label="6">
          6
        </button>

        <!-- − — Subtract operator (uses real minus sign U+2212) -->
        <button id="btn-sub"
                class="btn btn-operator"
                onclick="Calculator.handleOperator('−')"
                aria-label="Subtract">
          −
        </button>

        <!-- ── Row 4: 1 2 3 + ─────────────────────────────── -->

        <button id="btn-1"
                class="btn btn-number"
                onclick="Calculator.handleNumber('1')"
                aria-label="1">
          1
        </button>

        <button id="btn-2"
                class="btn btn-number"
                onclick="Calculator.handleNumber('2')"
                aria-label="2">
          2
        </button>

        <button id="btn-3"
                class="btn btn-number"
                onclick="Calculator.handleNumber('3')"
                aria-label="3">
          3
        </button>

        <!-- + — Add operator -->
        <button id="btn-add"
                class="btn btn-operator"
                onclick="Calculator.handleOperator('+')"
                aria-label="Add">
          +
        </button>

        <!-- ── Row 5: 0 (wide) . = ────────────────────────── -->

        <!-- 0 — spans 2 columns; left-aligned text per spec -->
        <button id="btn-0"
                class="btn btn-number btn-zero"
                onclick="Calculator.handleNumber('0')"
                aria-label="0">
          0
        </button>

        <!-- . — Decimal point -->
        <button id="btn-decimal"
                class="btn btn-number"
                onclick="Calculator.handleDecimal()"
                aria-label="Decimal point">
          .
        </button>

        <!-- = — Calculate result -->
        <button id="btn-equals"
                class="btn btn-equals"
                onclick="Calculator.calculate()"
                aria-label="Equals">
          =
        </button>

      </div><!-- /.btn-grid -->

    </section><!-- /.calculator-wrapper -->

  </main>

  <!-- ================================================================
       JavaScript — loaded at the bottom of <body>, in dependency order:
         1. calculator.js  — logic  (no DOM; must be first)
         2. display.js     — DOM updates (reads Calculator state)
         3. history.js     — history panel (reads Calculator state)
         4. keyboard.js    — keyboard bindings (uses all three above)
       ================================================================ -->
  <script src="js/calculator.js"></script>
  <script src="js/display.js"></script>
  <script src="js/history.js"></script>
  <script src="js/keyboard.js"></script>

</body>
</html>
